# Rift: persist systemd journal across reboots so a Pi crash leaves forensic
# evidence (the stock config keeps journals in /run/log/journal — tmpfs, lost
# on every boot). Capped at 200MB to bound SD-card write wear.
#
# Installed to /etc/systemd/journald.conf.d/ as a drop-in — does not modify
# the stock /etc/systemd/journald.conf. Revert with `rm` of the installed file.
[Journal]
Storage=persistent
SystemMaxUse=200M
SystemMaxFileSize=20M
SystemKeepFree=500M
MaxRetentionSec=1month
